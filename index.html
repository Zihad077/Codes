<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codes Store</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>
    <style>
        :root {
            color-scheme: dark;
        }
        * {
            box-sizing: border-box;
        }
        html {
            min-width: 320px;
            scroll-behavior: smooth;
        }
        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            color: #edf3f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #05070f;
            background-attachment: fixed;
        }
        button,
        input {
            font: inherit;
        }
        button {
            color: inherit;
        }

        /* ====== ANIMATED BACKGROUND ====== */
        .scene-bg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            background: linear-gradient(150deg, #060a18 0%, #081226 40%, #0a0f22 70%, #04060f 100%);
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            will-change: transform;
            animation: orbFloat 24s ease-in-out infinite alternate;
        }
        .orb-1 {
            top: -12%;
            left: -8%;
            width: 560px;
            height: 560px;
            background: radial-gradient(circle at 35% 35%, rgba(91, 144, 255, 0.55), transparent 68%);
            animation-duration: 24s;
        }
        .orb-2 {
            top: 8%;
            right: -12%;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle at 40% 40%, rgba(36, 214, 226, 0.4), transparent 68%);
            animation-duration: 28s;
            animation-delay: -6s;
        }
        .orb-3 {
            bottom: -18%;
            left: 6%;
            width: 620px;
            height: 620px;
            background: radial-gradient(circle at 45% 45%, rgba(126, 92, 255, 0.42), transparent 68%);
            animation-duration: 32s;
            animation-delay: -14s;
        }
        .orb-4 {
            bottom: 4%;
            right: 10%;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle at 40% 40%, rgba(255, 111, 165, 0.28), transparent 68%);
            animation-duration: 26s;
            animation-delay: -4s;
        }
        .orb-5 {
            top: 42%;
            left: 42%;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle at 45% 45%, rgba(70, 220, 190, 0.22), transparent 68%);
            animation-duration: 22s;
            animation-delay: -9s;
        }
        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(24px, -18px) scale(1.08);
            }
            66% {
                transform: translate(-16px, 20px) scale(0.92);
            }
            100% {
                transform: translate(12px, -8px) scale(1.04);
            }
        }

        .scene-bg::before {
            position: absolute;
            inset: 0;
            content: "";
            background:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at 50% 35%, black 0%, transparent 72%);
            opacity: 0.55;
        }
        .scene-bg::after {
            position: absolute;
            inset: 0;
            content: "";
            background: radial-gradient(circle at 50% 40%, transparent 45%, rgba(2, 4, 10, 0.55) 100%);
        }

        /* ====== TWINKLE STARS ====== */
        .twinkle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #eaf3ff;
            box-shadow: 0 0 6px 1px rgba(234, 243, 255, 0.7);
            animation: twinklePulse 4.5s ease-in-out infinite;
        }
        @keyframes twinklePulse {
            0%,
            100% {
                opacity: 0.15;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        .sparkle {
            position: absolute;
            width: 34px;
            height: 34px;
            opacity: 0.55;
            animation: starPulse 3.8s ease-in-out infinite;
        }
        .sparkle::before,
        .sparkle::after {
            position: absolute;
            inset: 0;
            content: "";
            background: #dbe4ef;
            clip-path: polygon(50% 0, 63% 35%, 100% 50%, 64% 64%, 50% 100%, 36% 64%, 0 50%, 36% 36%);
        }
        .sparkle::after {
            inset: 9px;
            transform: rotate(45deg);
            opacity: 0.65;
        }
        @keyframes starPulse {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(0.85) rotate(0deg);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.2) rotate(8deg);
            }
        }
        .sparkle-1 {
            top: 12%;
            right: 10%;
            width: 50px;
            height: 50px;
        }
        .sparkle-2 {
            bottom: 16%;
            left: 8%;
            width: 32px;
            height: 32px;
            animation-delay: -1.6s;
        }
        .sparkle-3 {
            top: 62%;
            right: 6%;
            width: 24px;
            height: 24px;
            animation-delay: -2.8s;
            opacity: 0.4;
        }
        .sparkle-4 {
            top: 28%;
            left: 42%;
            width: 18px;
            height: 18px;
            animation-delay: -0.8s;
            opacity: 0.5;
        }
        .sparkle-5 {
            bottom: 32%;
            right: 28%;
            width: 28px;
            height: 28px;
            animation-delay: -3.4s;
            opacity: 0.35;
        }

        /* ====== MAIN LAYOUT – reduced top padding ====== */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 20px 20px 60px;  /* was 72px top – now 20px */
        }

        /* ====== SEARCH BAR ====== */
        .search-form {
            position: sticky;
            top: 16px;   /* slightly closer to top */
            z-index: 10;
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 800px;
            height: 67px;
            margin-top: 0;
            padding: 0 16px 0 72px;
            border: 1.5px solid rgba(210, 232, 243, 0.3);
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(164, 203, 222, 0.1), rgba(60, 100, 128, 0.08) 54%, rgba(115, 158, 181, 0.1));
            box-shadow:
                inset 0 1px 3px rgba(237, 249, 255, 0.3),
                inset 0 -1px 3px rgba(223, 242, 250, 0.16),
                0 6px 14px rgba(0, 7, 24, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: height 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-radius 0.4s ease,
                padding 0.4s ease,
                box-shadow 0.5s ease,
                border-color 0.5s ease,
                transform 0.4s ease;
            transform-origin: top center;
        }

        /* ====== SEARCH BAR PULSING GLOW ====== */
        .search-form::before {
            position: absolute;
            top: -13px;
            left: -7px;
            width: 36px;
            height: 36px;
            content: "";
            pointer-events: none;
            background:
                radial-gradient(circle, white 0 5%, transparent 22%),
                conic-gradient(from 0deg,
                    transparent,
                    rgba(255, 255, 255, 0.72),
                    transparent 13%,
                    transparent 36%,
                    rgba(255, 255, 255, 0.58),
                    transparent 49%,
                    transparent 72%,
                    rgba(255, 255, 255, 0.5),
                    transparent 86%);
            border-radius: 50%;
            filter: blur(0.2px) drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
            opacity: 0.55;
            animation: glint 3.6s ease-in-out infinite;
            transition: transform 0.6s ease, opacity 0.6s ease;
        }
        @keyframes glint {
            0%,
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.3) rotate(12deg);
                opacity: 0.95;
            }
        }

        .search-form.pulse {
            animation: searchPulse 3.2s ease-in-out infinite;
        }
        @keyframes searchPulse {
            0%,
            100% {
                transform: scale(1);
                border-color: rgba(210, 232, 243, 0.3);
                box-shadow: 0 6px 14px rgba(0, 7, 24, 0.2), 0 0 30px rgba(91, 180, 255, 0.02);
            }
            50% {
                transform: scale(1.005);
                border-color: rgba(210, 232, 243, 0.5);
                box-shadow: 0 6px 20px rgba(0, 7, 24, 0.3), 0 0 50px rgba(91, 180, 255, 0.08);
            }
        }

        .search-form.expanded {
            height: 74px;
            border-radius: 28px;
            padding: 0 16px 0 72px;
            border-color: rgba(210, 232, 243, 0.55);
            box-shadow: 0 6px 24px rgba(0, 7, 24, 0.35), 0 0 60px rgba(91, 180, 255, 0.06);
            transform: scale(1.01);
        }
        .search-form.expanded::before {
            transform: scale(1.5) rotate(20deg);
            opacity: 0.9;
        }

        /* ====== CODE MARK ICON ====== */
        .code-mark {
            position: absolute;
            left: 16px;
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(91, 180, 255, 0.25), rgba(126, 92, 255, 0.2));
            color: #a8d4ff;
            font-size: 14px;
            letter-spacing: 0;
            pointer-events: none;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-radius 0.4s ease,
                background 0.5s ease;
            animation: codeMarkPulse 3s ease-in-out infinite;
        }
        @keyframes codeMarkPulse {
            0%,
            100% {
                transform: scale(1) rotate(0deg);
                box-shadow: 0 0 0 0 rgba(91, 180, 255, 0.2);
            }
            50% {
                transform: scale(1.06) rotate(2deg);
                box-shadow: 0 0 20px 4px rgba(91, 180, 255, 0.15);
            }
        }
        .search-form.expanded .code-mark {
            transform: scale(1.1) rotate(4deg);
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(91, 180, 255, 0.35), rgba(126, 92, 255, 0.3));
        }

        .code-mark svg {
            display: block;
            width: 24px;
            height: 24px;
            transition: transform 0.6s ease;
        }
        .search-form.expanded .code-mark svg {
            transform: rotate(12deg) scale(1.05);
        }

        /* ====== SEARCH INPUT ====== */
        .search-input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            color: #eff4f7;
            background: transparent;
            font-size: 26px;
            font-weight: 470;
            letter-spacing: -0.8px;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.6);
            transition: font-size 0.4s ease;
        }
        .search-input::placeholder {
            color: #edf1f4;
            opacity: 0.93;
        }
        .search-form.expanded .search-input {
            font-size: 28px;
        }

        /* ====== SEARCH SUBMIT BUTTON ====== */
        .search-submit {
            position: relative;
            width: 38px;
            height: 38px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
        }
        .search-submit:hover {
            transform: scale(1.12);
            background: rgba(255, 255, 255, 0.05);
        }
        .search-submit::before {
            position: absolute;
            top: 3px;
            left: 2px;
            width: 25px;
            height: 25px;
            content: "";
            border: 2px solid #b9d5e4;
            border-radius: 50%;
            transition: border-color 0.3s ease, transform 0.3s ease;
        }
        .search-submit::after {
            position: absolute;
            right: 3px;
            bottom: 4px;
            width: 15px;
            height: 2px;
            content: "";
            border-radius: 2px;
            background: #b9d5e4;
            transform: rotate(48deg);
            transform-origin: right center;
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .search-submit:hover::before {
            border-color: #e8f4fa;
            transform: scale(1.05);
        }
        .search-submit:hover::after {
            background: #e8f4fa;
        }

        /* ====== COLLECTION HEADING ====== */
        .collection-heading {
            width: 100%;
            max-width: 1200px;
            margin: 18px 0 14px;  /* reduced top margin */
            color: #848f9b;
            font-size: 28px;
            font-weight: 650;
            line-height: 1;
            letter-spacing: -0.6px;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.56);
            text-align: left;
            animation: headingFade 0.8s ease forwards;
            opacity: 0;
            transform: translateY(12px);
        }
        @keyframes headingFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ====== CARD GRID ====== */
        .code-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            width: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
            margin-bottom: 40px;
        }

        /* ====== CARD STYLES ====== */
        .code-card {
            position: relative;
            height: 240px;
            overflow: hidden;
            border: 1px solid rgba(211, 232, 241, 0.3);
            border-radius: 24px;
            background: linear-gradient(153deg,
                    rgba(166, 201, 216, 0.11),
                    rgba(58, 91, 118, 0.08) 45%,
                    rgba(113, 141, 157, 0.12)),
                rgba(78, 116, 140, 0.08);
            box-shadow:
                inset 2px 2px 4px rgba(232, 246, 251, 0.16),
                inset -1px -2px 3px rgba(207, 231, 242, 0.14),
                0 6px 10px rgba(0, 4, 17, 0.28);
            backdrop-filter: blur(8px) saturate(104%);
            transform: translateY(24px) scale(0.96);
            opacity: 0;
            transition:
                transform 550ms cubic-bezier(0.16, 0.8, 0.2, 1),
                opacity 500ms ease,
                border-color 250ms ease,
                box-shadow 300ms ease,
                filter 300ms ease;
            will-change: transform, opacity;
        }
        .code-card.is-visible {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .code-card:hover {
            z-index: 2;
            border-color: rgba(230, 244, 250, 0.5);
            transform: translateY(-4px) scale(1.015);
            box-shadow:
                inset 2px 2px 4px rgba(232, 246, 251, 0.2),
                inset -1px -2px 3px rgba(207, 231, 242, 0.18),
                0 14px 28px rgba(0, 4, 17, 0.45),
                0 0 40px rgba(91, 180, 255, 0.04);
        }

        .code-card::before {
            position: absolute;
            top: 5px;
            left: 14px;
            width: 68%;
            height: 13px;
            content: "";
            pointer-events: none;
            border-radius: 50%;
            background: linear-gradient(90deg, rgba(236, 249, 254, 0.22), rgba(236, 249, 254, 0));
            filter: blur(3px);
            transform: rotate(-3deg);
            opacity: 0.5;
            transition: opacity 0.4s ease;
        }
        .code-card:hover::before {
            opacity: 0.8;
        }

        .code-card::after {
            position: absolute;
            inset: 0;
            content: "";
            pointer-events: none;
            border-radius: inherit;
            background: linear-gradient(145deg,
                    rgba(255, 255, 255, 0.03),
                    transparent 29%,
                    transparent 72%,
                    rgba(222, 240, 248, 0.03));
        }

        img.art {
            position: absolute;
            z-index: 1;
            left: 50%;
            transform: translateX(-50%);
            object-fit: contain;
            max-width: none !important;
            filter: drop-shadow(0 5px 4px rgba(0, 0, 0, 0.48));
            transition: transform 400ms cubic-bezier(0.16, 0.8, 0.2, 1),
                filter 400ms ease;
            will-change: transform;
        }
        .code-card:hover img.art {
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.55));
            transform: translateX(-50%) translateY(-4px) scale(1.04);
        }

        .card-name {
            position: absolute;
            z-index: 2;
            left: 6px;
            right: 6px;
            margin: 0;
            overflow: hidden;
            color: #e8ecf0;
            text-align: center;
            text-overflow: ellipsis;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.76);
            white-space: nowrap;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .code-card:hover .card-name {
            color: #ffffff;
        }

        .card-actions {
            position: absolute;
            z-index: 3;
            right: 10px;
            bottom: 12px;
            left: 10px;
            display: grid;
            grid-template-columns: 56px minmax(0, 1fr);
            gap: 10px;
            height: 49px;
        }

        .glass-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            height: 49px;
            padding: 0;
            border: 1px solid rgba(219, 238, 247, 0.32);
            border-radius: 15px;
            outline: 0;
            background: linear-gradient(155deg, rgba(191, 219, 231, 0.13), rgba(53, 82, 105, 0.16));
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.25s cubic-bezier(0.16, 0.8, 0.2, 1);
            overflow: hidden;
        }
        .glass-button::after {
            position: absolute;
            inset: 0;
            content: "";
            border-radius: inherit;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.02), transparent 60%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .glass-button:hover::after {
            opacity: 1;
        }
        .glass-button:hover {
            background: linear-gradient(155deg, rgba(208, 232, 242, 0.2), rgba(68, 103, 127, 0.22));
            transform: translateY(-2px) scale(1.02);
            border-color: rgba(219, 238, 247, 0.5);
            box-shadow: 0 6px 16px rgba(0, 4, 17, 0.3);
        }
        .glass-button:active {
            transform: translateY(0px) scale(0.97);
        }

        .play-icon {
            width: 0;
            height: 0;
            margin-left: 4px;
            border-top: 13px solid transparent;
            border-bottom: 13px solid transparent;
            border-left: 20px solid rgba(222, 237, 245, 0.9);
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.6));
            transition: border-color 0.3s ease, transform 0.3s ease;
        }
        .glass-button:hover .play-icon {
            border-left-color: #ffffff;
            transform: scale(1.08);
        }

        .get-button {
            overflow: hidden;
            color: #bad9e9;
            font-size: 22px;
            font-weight: 530;
            letter-spacing: -1px;
            transition: color 0.3s ease, letter-spacing 0.3s ease;
        }
        .glass-button:hover .get-button {
            color: #eaf4fa;
            letter-spacing: -0.5px;
        }

        /* ====== TOAST ====== */
        .toast-popup {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #eff4f7;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: auto;
            transition: all 0.3s ease;
        }
        .toast-popup.hide {
            animation: slideUp 0.35s ease-in forwards;
        }
        @keyframes slideDown {
            0% {
                opacity: 0;
                transform: translateY(-40px) scale(0.92);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes slideUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-40px) scale(0.92);
            }
        }

        /* ====== MODAL ====== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 15, 0.78);
            backdrop-filter: blur(12px);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        @keyframes modalEnter {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes modalExit {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
        }
        .modal-content {
            background: linear-gradient(145deg, rgba(23, 32, 51, 0.96), rgba(10, 15, 26, 0.98));
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 20px;
            width: 100%;
            max-width: 750px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: modalEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-overlay.closing .modal-content {
            animation: modalExit 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ====== FILE BLOCK (accordion) ====== */
        .file-block {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 14px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .file-block:hover {
            border-color: rgba(148, 163, 184, 0.3);
            box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.2);
        }

        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.4));
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
        }
        .file-header:hover {
            background: linear-gradient(90deg, rgba(51, 65, 85, 0.6), rgba(30, 41, 59, 0.4));
        }
        .file-header.active {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.15), rgba(37, 99, 235, 0.05));
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }

        .accordion-icon {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #94a3b8;
        }
        .file-header.active .accordion-icon {
            transform: rotate(180deg);
            color: #60a5fa;
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion-body.open {
            max-height: 4000px;
            overflow: visible;
        }

        .code-container {
            position: relative;
            padding: 20px;
            background: #090c15;
            border-radius: 0 0 14px 14px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.4);
            transition: background 0.3s ease;
        }
        .code-container:hover {
            background: #0b0f1a;
        }

        /* ====== SCROLLBAR ====== */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }
        .modal-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            transition: background 0.3s ease;
        }
        .modal-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* ====== TOP BUTTONS ====== */
        .top-btn {
            transition: all 0.3s cubic-bezier(0.16, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .top-btn::after {
            position: absolute;
            inset: 0;
            content: "";
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), transparent 60%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            border-radius: inherit;
        }
        .top-btn:hover::after {
            opacity: 1;
        }
        .top-btn:active {
            transform: scale(0.95) !important;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 560px) {
            .main-container {
                padding: 14px 16px 40px;  /* even smaller on mobile */
            }
            .search-form {
                padding: 0 16px 0 63px;
                height: 58px;
                border-radius: 18px;
                top: 12px;
            }
            .search-form.expanded {
                height: 64px;
                padding: 0 16px 0 63px;
                border-radius: 22px;
            }
            .search-form::before {
                width: 28px;
                height: 28px;
                top: -10px;
                left: -5px;
            }
            .code-mark {
                width: 36px;
                height: 36px;
                left: 12px;
                border-radius: 10px;
            }
            .code-mark svg {
                width: 20px;
                height: 20px;
            }
            .search-input {
                font-size: 20px;
            }
            .search-form.expanded .search-input {
                font-size: 22px;
            }
            .code-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px 12px;
            }
            .code-card {
                height: 240px;
                border-radius: 20px;
            }
            .card-actions {
                right: 8px;
                bottom: 12px;
                left: 8px;
                grid-template-columns: minmax(39px, 31%) minmax(0, 1fr);
                gap: 6px;
                height: 44px;
            }
            .get-button {
                font-size: 18px;
            }
            .play-icon {
                border-top-width: 9px;
                border-bottom-width: 9px;
                border-left-width: 14px;
            }
            .collection-heading {
                font-size: clamp(21px, 6.4vw, 27px);
                margin: 14px 0 12px;
                text-align: center;
            }
            .modal-content {
                padding: 20px 15px;
            }
            .file-header {
                padding: 12px 14px;
            }
            .code-container {
                padding: 15px;
            }
            .search-submit {
                width: 32px;
                height: 32px;
            }
            .search-submit::before {
                width: 20px;
                height: 20px;
                top: 2px;
                left: 2px;
            }
            .search-submit::after {
                right: 2px;
                bottom: 3px;
                width: 12px;
                height: 2px;
            }
            .top-btn {
                font-size: 11px !important;
                padding: 0 10px !important;
                height: 32px !important;
            }
            .top-btn svg {
                width: 12px;
                height: 12px;
            }
        }

        @media (min-width: 561px) and (max-width: 900px) {
            .code-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        /* ====== ADDITIONAL MICRO-ANIMATIONS ====== */
        .fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hover-lift {
            transition: transform 0.25s cubic-bezier(0.16, 0.8, 0.2, 1),
                box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-close-btn {
            transition: all 0.3s cubic-bezier(0.16, 0.8, 0.2, 1);
        }
        .modal-close-btn:hover {
            transform: rotate(90deg) scale(1.1);
            background: rgba(255, 255, 255, 0.12);
        }

        .copy-btn {
            transition: all 0.3s cubic-bezier(0.16, 0.8, 0.2, 1);
        }
        .copy-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .copy-btn:active {
            transform: scale(0.94);
        }

        /* ====== STAR BLEND ON SEARCH BAR ====== */
        .search-form .star-blend {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 0;
        }
        .search-form:hover .star-blend,
        .search-form.expanded .star-blend {
            opacity: 1;
        }
        .search-form .star-blend .mini-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: miniTwinkle 3s ease-in-out infinite;
        }
        @keyframes miniTwinkle {
            0%,
            100% {
                opacity: 0.1;
                transform: scale(0.5);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.8);
            }
        }

        .code-card.loading {
            background: linear-gradient(110deg,
                    rgba(78, 116, 140, 0.05) 30%,
                    rgba(78, 116, 140, 0.15) 50%,
                    rgba(78, 116, 140, 0.05) 70%);
            background-size: 200% 100%;
            animation: shimmer 1.8s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCfTlfkxKu39GkMJ2wSK29KNyZNybBZob8",
        authDomain: "studio-4878590778-ff009.firebaseapp.com",
        projectId: "studio-4878590778-ff009",
        storageBucket: "studio-4878590778-ff009.firebasestorage.app",
        messagingSenderId: "953247695623",
        appId: "1:953247695623:web:83e0a58f27721439ddbba2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allCardsData = [];

    // --- Toast ---
    window.showToast = function(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast-popup';
        const icon = type === 'error' ? '⚠️' : type === 'info' ? 'ℹ️' : '✅';
        toast.innerHTML = `<span class="text-xl">${icon}</span> <span class="text-sm md:text-base">${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('hide');
            setTimeout(() => toast.remove(), 350);
        }, 3000);
    }

    // --- PWA install ---
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });
    window.installApp = async function() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') showToast("App installation started...", "success");
            deferredPrompt = null;
        } else {
            showToast("ব্রাউজারের মেনু থেকে 'Install app' বা 'Add to Home Screen' এ ক্লিক করুন।", "info");
        }
    }

    // --- Search toggle with animation ---
    const searchContainer = document.getElementById('searchContainer');

    window.openSearch = function() {
        document.getElementById('titleMode').classList.add('hidden');
        document.getElementById('searchMode').classList.remove('hidden');
        document.getElementById('userSearch').focus();
        searchContainer.classList.add('expanded');
        searchContainer.classList.remove('pulse');
    }

    window.closeSearch = function() {
        document.getElementById('titleMode').classList.remove('hidden');
        document.getElementById('searchMode').classList.add('hidden');
        document.getElementById('userSearch').value = '';
        filterUserCards();
        searchContainer.classList.remove('expanded');
        setTimeout(() => {
            if (!searchContainer.classList.contains('expanded')) {
                searchContainer.classList.add('pulse');
            }
        }, 500);
    }

    // --- Fetch data ---
    async function fetchCards() {
        const querySnapshot = await getDocs(collection(db, "codes"));
        querySnapshot.forEach(docSnap => {
            allCardsData.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderCards(allCardsData);
    }

    // --- Render grid ---
    function renderCards(data) {
        const grid = document.getElementById('dynamicCardsGrid');
        grid.innerHTML = "";
        let delay = 0;
        data.forEach(card => {
            const leftOffset = card.imageStyle?.left || "0px";
            const transformStyle = `translateX(calc(-50% + ${leftOffset}))`;
            const styleSetting = card.imageStyle ?
                `width: ${card.imageStyle.width}; height: ${card.imageStyle.height}; top: ${card.imageStyle.top}; left: 50%; transform: ${transformStyle};` :
                `width: 100%; height: 135px; top: 0; padding: 14px 14px 0 14px; left: 50%; transform: translateX(-50%);`;
            const titleFontSize = card.imageStyle?.titleFontSize || "20px";
            const titleStyleSetting = card.imageStyle ?
                `top: ${card.imageStyle.titleTop}; font-size: ${titleFontSize};` :
                `top: 142px; font-size: 20px;`;

            const li = document.createElement('li');
            li.innerHTML = `
                <article class="code-card" style="--delay: ${delay}ms">
                    <img class="art" src="${card.imageUrl}" style="${styleSetting}" alt="Icon" loading="lazy" decoding="async">
                    <h2 class="card-name" style="${titleStyleSetting}">${card.title}</h2>
                    <div class="card-actions">
                        <button class="glass-button" type="button" onclick="openYoutube('${card.youtubeLink}')" aria-label="Play"><span class="play-icon"></span></button>
                        <button class="glass-button get-button" type="button" onclick="openModal('${card.id}')">get code</button>
                    </div>
                </article>
            `;
            grid.appendChild(li);
            delay += 60;
        });
        initObserver();
    }

    window.filterUserCards = function() {
        const query = document.getElementById('userSearch').value.toLowerCase();
        const filtered = allCardsData.filter(c => c.title.toLowerCase().includes(query));
        renderCards(filtered);
    }

    window.openYoutube = function(link) {
        if (link && link.includes("http")) {
            window.open(link, '_blank');
        } else {
            showToast("No YouTube link attached.", "error");
        }
    }

    // --- Modal ---
    window.openModal = function(id) {
        const card = allCardsData.find(c => c.id === id);
        const container = document.getElementById('modalFilesContainer');
        document.getElementById('modalTitle').innerText = card.title;
        container.innerHTML = "";

        if (card.codeSnippets && card.codeSnippets.length > 0) {
            const isSingle = card.codeSnippets.length === 1;
            card.codeSnippets.forEach((file, index) => {
                const isOpenClass = isSingle ? "open" : "";
                const headerActive = isSingle ? "active" : "";
                container.innerHTML += `
                    <div class="file-block">
                        <div class="file-header ${headerActive}" onclick="toggleAccordion(${index}, ${isSingle})">
                            <div class="flex items-center gap-3 overflow-hidden">
                                <div class="accordion-icon ${isSingle ? 'hidden' : ''}">
                                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                                <svg class="flex-shrink-0 text-blue-400 opacity-80" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                                <div class="flex flex-col text-left truncate">
                                    <span class="text-[#e2e8f0] font-semibold tracking-wide text-[15px] md:text-[17px] leading-tight truncate">${file.fileName}</span>
                                    ${!isSingle ? '<span class="text-[11px] text-gray-500 font-medium mt-0.5">Click to view code</span>' : ''}
                                </div>
                            </div>
                            <button onclick="event.stopPropagation(); copyText('${file.fileName}', this, false)" class="text-[12px] font-medium bg-white/5 hover:bg-white/20 border border-white/10 px-3 py-1.5 rounded-lg text-gray-300 hover:text-white transition ml-2 flex-shrink-0 backdrop-blur-md shadow-sm">Copy Name</button>
                        </div>
                        <div class="accordion-body ${isOpenClass}" id="acc-body-${index}">
                            <div class="code-container group">
                                <button onclick="copyText(\`${encodeURIComponent(file.code)}\`, this, true)" class="copy-btn absolute top-3 right-3 text-[12px] font-medium bg-blue-600/90 hover:bg-blue-500 text-white px-4 py-2 rounded-lg backdrop-blur-md shadow-lg transition-all z-10 opacity-90 group-hover:opacity-100 flex items-center gap-1.5">
                                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
                                    Copy Code
                                </button>
                                <pre class="m-0 overflow-x-auto text-[13px] md:text-sm text-[#c9d1d9] font-mono whitespace-pre-wrap pt-10 md:pt-4 pb-2 leading-relaxed tracking-tight">${escapeHTML(file.code)}</pre>
                            </div>
                        </div>
                    </div>
                `;
            });
        } else {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10 opacity-60">
                    <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" class="mb-3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <p class="text-gray-400 text-center text-lg">No code files attached.</p>
                </div>
            `;
        }

        document.body.style.overflow = 'hidden';
        const modal = document.getElementById('codeModal');
        modal.classList.remove('closing');
        modal.classList.add('show');
    }

    window.toggleAccordion = function(index, isSingle) {
        if (isSingle) return;
        const allBodies = document.querySelectorAll('.accordion-body');
        const allHeaders = document.querySelectorAll('.file-header');
        allBodies.forEach((body, i) => {
            if (i === index) {
                body.classList.toggle('open');
                allHeaders[i].classList.toggle('active');
            } else {
                body.classList.remove('open');
                allHeaders[i].classList.remove('active');
            }
        });
    }

    window.closeModal = function() {
        document.body.style.overflow = 'auto';
        const modal = document.getElementById('codeModal');
        modal.classList.add('closing');
        setTimeout(() => {
            modal.classList.remove('show', 'closing');
        }, 350);
    }

    // --- Copy ---
    window.copyText = function(text, btn, isEncoded) {
        const txt = isEncoded ? decodeURIComponent(text) : text;
        navigator.clipboard.writeText(txt).then(() => {
            const orig = btn.innerHTML;
            btn.innerText = "Copied ✔";
            btn.style.background = "#16a34a";
            btn.style.borderColor = "#16a34a";
            btn.style.color = "white";
            setTimeout(() => {
                btn.innerHTML = orig;
                btn.style.background = "";
                btn.style.borderColor = "";
                btn.style.color = "";
            }, 2000);
        });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' } [t] || t));
    }

    // --- Intersection Observer for cards ---
    function initObserver() {
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    const el = e.target;
                    const delay = el.style.getPropertyValue('--delay') || '0ms';
                    el.style.transitionDelay = delay;
                    el.classList.add('is-visible');
                    observer.unobserve(el);
                }
            });
        }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });
        document.querySelectorAll('.code-card').forEach(c => observer.observe(c));
    }

    // --- Start ---
    fetchCards();
    setTimeout(initObserver, 800);
</script>
</body>
</html>
