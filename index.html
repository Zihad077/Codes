<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codes Store</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body { min-width: 320px; min-height: 100vh; margin: 0; overflow-x: hidden; -webkit-overflow-scrolling: touch; color: #edf3f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #05070f; background-attachment: fixed; }
    button, input { font: inherit; } button { color: inherit; }

    /* Animated background */
    .scene-bg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; overflow: hidden; background: linear-gradient(150deg, #060a18 0%, #081226 40%, #0a0f22 70%, #04060f 100%); }
    .orb { position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform; animation: orbFloat 24s ease-in-out infinite alternate; }
    .orb-1 { top: -12%; left: -8%; width: 560px; height: 560px; background: radial-gradient(circle at 35% 35%, rgba(91, 144, 255, 0.55), transparent 68%); animation-duration: 24s; }
    .orb-2 { top: 8%; right: -12%; width: 480px; height: 480px; background: radial-gradient(circle at 40% 40%, rgba(36, 214, 226, 0.4), transparent 68%); animation-duration: 28s; animation-delay: -6s; }
    .orb-3 { bottom: -18%; left: 6%; width: 620px; height: 620px; background: radial-gradient(circle at 45% 45%, rgba(126, 92, 255, 0.42), transparent 68%); animation-duration: 32s; animation-delay: -14s; }
    .orb-4 { bottom: 4%; right: 10%; width: 380px; height: 380px; background: radial-gradient(circle at 40% 40%, rgba(255, 111, 165, 0.28), transparent 68%); animation-duration: 26s; animation-delay: -4s; }
    .orb-5 { top: 42%; left: 42%; width: 340px; height: 340px; background: radial-gradient(circle at 45% 45%, rgba(70, 220, 190, 0.22), transparent 68%); animation-duration: 22s; animation-delay: -9s; }
    .scene-bg::before { position: absolute; inset: 0; content: ""; background: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); background-size: 64px 64px; mask-image: radial-gradient(circle at 50% 35%, black 0%, transparent 72%); opacity: 0.55; }
    .scene-bg::after { position: absolute; inset: 0; content: ""; background: radial-gradient(circle at 50% 40%, transparent 45%, rgba(2, 4, 10, 0.55) 100%); }
    .twinkle { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #eaf3ff; box-shadow: 0 0 6px 1px rgba(234, 243, 255, 0.7); animation: twinklePulse 4.5s ease-in-out infinite; }
    .sparkle { position: absolute; width: 34px; height: 34px; opacity: 0.55; animation: starPulse 3.8s ease-in-out infinite; }
    .sparkle::before, .sparkle::after { position: absolute; inset: 0; content: ""; background: #dbe4ef; clip-path: polygon(50% 0, 63% 35%, 100% 50%, 64% 64%, 50% 100%, 36% 64%, 0 50%, 36% 36%); }
    .sparkle::after { inset: 9px; transform: rotate(45deg); opacity: 0.65; }
    .sparkle-1 { top: 12%; right: 10%; width: 50px; height: 50px; } .sparkle-2 { bottom: 16%; left: 8%; width: 32px; height: 32px; animation-delay: -1.6s; } .sparkle-3 { top: 62%; right: 6%; width: 24px; height: 24px; animation-delay: -2.8s; opacity: 0.4; }
    
    .main-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; min-height: 100vh; padding: 72px 20px 60px; }
    
    /* Search Bar */
    .search-form { position: sticky; top: 20px; z-index: 10; display: flex; align-items: center; width: 100%; max-width: 800px; height: 67px; margin-top: 0; padding: 0 16px 0 72px; border: 1.5px solid rgba(210, 232, 243, 0.3); border-radius: 22px; background: linear-gradient(180deg, rgba(164, 203, 222, 0.1), rgba(60, 100, 128, 0.08) 54%, rgba(115, 158, 181, 0.1)); box-shadow: inset 0 1px 3px rgba(237, 249, 255, 0.3), inset 0 -1px 3px rgba(223, 242, 250, 0.16), 0 6px 14px rgba(0, 7, 24, 0.2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .search-form::before { position: absolute; top: -13px; left: -7px; width: 36px; height: 36px; content: ""; pointer-events: none; background: radial-gradient(circle, white 0 5%, transparent 22%), conic-gradient(from 0deg, transparent, rgba(255,255,255,.72), transparent 13%, transparent 36%, rgba(255,255,255,.58), transparent 49%, transparent 72%, rgba(255,255,255,.5), transparent 86%); border-radius: 50%; filter: blur(0.2px) drop-shadow(0 0 4px rgba(255, 255, 255, 0.6)); opacity: 0.55; animation: glint 3.6s ease-in-out infinite; }
    
    .code-mark { position: absolute; left: 16px; display: grid; width: 42px; height: 42px; place-items: center; border: none; border-radius: 12px; background: linear-gradient(135deg, rgba(91, 180, 255, 0.25), rgba(126, 92, 255, 0.2)); color: #a8d4ff; font-size: 14px; letter-spacing: 0; pointer-events: none; }
    .code-mark svg { display: block; width: 24px; height: 24px; }
    
    .search-input { width: 100%; min-width: 0; border: 0; outline: 0; color: #eff4f7; background: transparent; font-size: 26px; font-weight: 470; letter-spacing: -0.8px; text-shadow: 0 2px 3px rgba(0, 0, 0, 0.6); }
    .search-input::placeholder { color: #edf1f4; opacity: 0.93; }
    
    .search-submit { position: relative; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
    .search-submit::before { position: absolute; top: 3px; left: 2px; width: 25px; height: 25px; content: ""; border: 2px solid #b9d5e4; border-radius: 50%; }
    .search-submit::after { position: absolute; right: 3px; bottom: 4px; width: 15px; height: 2px; content: ""; border-radius: 2px; background: #b9d5e4; transform: rotate(48deg); transform-origin: right center; }
    
    .collection-heading { width: 100%; max-width: 1200px; margin: 24px 0 18px; color: #848f9b; font-size: 28px; font-weight: 650; line-height: 1; letter-spacing: -0.6px; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.56); text-align: left; }
    
    /* Card Grid */
    .code-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; width: 100%; margin: 0; padding: 0; list-style: none; margin-bottom: 40px; }
    
    /* Card Styles */
    .code-card { position: relative; height: 240px; overflow: hidden; border: 1px solid rgba(211, 232, 241, 0.3); border-radius: 24px; background: linear-gradient(153deg, rgba(166, 201, 216, 0.11), rgba(58, 91, 118, 0.08) 45%, rgba(113, 141, 157, 0.12)), rgba(78, 116, 140, 0.08); box-shadow: inset 2px 2px 4px rgba(232, 246, 251, 0.16), inset -1px -2px 3px rgba(207, 231, 242, 0.14), 0 6px 10px rgba(0, 4, 17, 0.28); backdrop-filter: blur(8px) saturate(104%); transform: translateY(16px); opacity: 0; transition: transform 450ms cubic-bezier(0.2, 0.72, 0.2, 1), opacity 450ms ease, border-color 220ms ease, box-shadow 220ms ease; }
    .code-card.is-visible { transform: translateY(0); opacity: 1; }
    .code-card:hover { z-index: 2; border-color: rgba(230, 244, 250, 0.45); transform: translateY(-3px); }
    .code-card::before { position: absolute; top: 5px; left: 14px; width: 68%; height: 13px; content: ""; pointer-events: none; border-radius: 50%; background: linear-gradient(90deg, rgba(236, 249, 254, 0.22), rgba(236, 249, 254, 0)); filter: blur(3px); transform: rotate(-3deg); opacity: 0.5; }
    .code-card::after { position: absolute; inset: 0; content: ""; pointer-events: none; border-radius: inherit; background: linear-gradient(145deg, rgba(255,255,255,.03), transparent 29%, transparent 72%, rgba(222,240,248,.03)); }
    
    img.art { position: absolute; z-index: 1; left: 50%; transform: translateX(-50%); object-fit: contain; max-width: none !important; filter: drop-shadow(0 5px 4px rgba(0, 0, 0, 0.48)); transition: transform 300ms ease, filter 300ms ease; }
    .code-card:hover img.art { filter: drop-shadow(0 7px 7px rgba(0, 0, 0, 0.52)); transform: translateY(-3px) scale(1.03); }
    
    .card-name { position: absolute; z-index: 2; left: 6px; right: 6px; margin: 0; overflow: hidden; color: #e8ecf0; text-align: center; text-overflow: ellipsis; text-shadow: 0 2px 3px rgba(0, 0, 0, 0.76); white-space: nowrap; }
    
    .card-actions { position: absolute; z-index: 3; right: 10px; bottom: 12px; left: 10px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; height: 49px; }
    
    .glass-button { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 0; height: 49px; padding: 0; border: 1px solid rgba(219, 238, 247, 0.32); border-radius: 15px; outline: 0; background: linear-gradient(155deg, rgba(191, 219, 231, 0.13), rgba(53, 82, 105, 0.16)); cursor: pointer; backdrop-filter: blur(4px); transition: 0.2s; }
    .glass-button:hover { background: linear-gradient(155deg, rgba(208, 232, 242, 0.19), rgba(68, 103, 127, 0.2)); transform: translateY(-2px); }
    .play-icon { width: 0; height: 0; margin-left: 4px; border-top: 13px solid transparent; border-bottom: 13px solid transparent; border-left: 20px solid rgba(222, 237, 245, 0.9); filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.6)); }
    .get-button { overflow: hidden; color: #bad9e9; font-size: 22px; font-weight: 530; letter-spacing: -1px; }

    /* Toast Notification UI */
    .toast-popup { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); color: #eff4f7; padding: 12px 20px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; font-weight: 500; animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .toast-popup.hide { animation: slideUp 0.3s ease-in forwards; }
    @keyframes slideDown { 0% { opacity: 0; transform: translateY(-30px) scale(0.9); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes slideUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-30px) scale(0.9); } }

    /* Modal & Accordion */
    .modal-overlay { position: fixed; inset: 0; background: rgba(5, 7, 15, 0.75); backdrop-filter: blur(10px); z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
    .modal-overlay.show { display: flex; opacity: 1; }
    
    @keyframes modalEnter { from { opacity: 0; transform: scale(0.92) translateY(15px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    
    .modal-content { background: linear-gradient(145deg, rgba(23, 32, 51, 0.95), rgba(10, 15, 26, 0.98)); border: 1px solid rgba(96, 165, 250, 0.2); border-radius: 20px; width: 100%; max-width: 750px; max-height: 85vh; overflow-y: auto; padding: 28px; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1); animation: modalEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .file-block { background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 14px; margin-bottom: 16px; overflow: hidden; transition: 0.3s; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .file-header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(90deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.4)); padding: 16px 20px; cursor: pointer; user-select: none; transition: 0.3s; border-bottom: 1px solid transparent; }
    .file-header:hover { background: linear-gradient(90deg, rgba(51, 65, 85, 0.6), rgba(30, 41, 59, 0.4)); }
    .file-header.active { background: linear-gradient(90deg, rgba(59, 130, 246, 0.15), rgba(37, 99, 235, 0.05)); border-bottom: 1px solid rgba(59, 130, 246, 0.2); }
    .accordion-icon { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: #94a3b8; }
    .file-header.active .accordion-icon { transform: rotate(180deg); color: #60a5fa; }
    .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .accordion-body.open { max-height: 4000px; overflow: visible; }
    .code-container { position: relative; padding: 20px; background: #090c15; border-radius: 0 0 14px 14px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.4); }

    /* Custom Scrollbar for Modal */
    .modal-content::-webkit-scrollbar { width: 8px; }
    .modal-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
    .modal-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    .modal-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

    /* For Mobile view */
    @media (max-width: 560px) {
      .main-container { padding: 40px 16px 40px; }
      .search-form { padding: 0 16px 0 63px; height: 58px; border-radius: 18px; }
      .code-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
      .code-card { height: 240px; border-radius: 20px; }
      
      .card-actions { right: 8px; bottom: 12px; left: 8px; grid-template-columns: minmax(39px, 31%) minmax(0, 1fr); gap: 6px; height: 44px; }
      .get-button { font-size: 18px; }
      .play-icon { border-top-width: 9px; border-bottom-width: 9px; border-left-width: 14px; }
      .collection-heading { font-size: clamp(21px, 6.4vw, 27px); margin: 20px 0 14px; text-align: center; }
      
      .modal-content { padding: 20px 15px; }
      .file-header { padding: 12px 14px; }
      .code-container { padding: 15px; }
    }
    
    @media (min-width: 561px) and (max-width: 900px) {
      .code-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>

        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>

    </div>

    <!-- Header / Search Bar -->
    <div class="search-form" id="searchContainer">
      <span class="code-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></span>
      
      <div id="titleMode" class="w-full flex justify-between items-center ml-2 h-full">

  <!-- Modal for showing Codes -->
  <div class="modal-overlay" id="codeModal">
    <div class="modal-content">
      <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white text-2xl font-bold cursor-pointer transition z-50 bg-white/5 hover:bg-white/10 w-10 h-10 rounded-full flex items-center justify-center">✕</button>

      <div id="modalFilesContainer" class="mt-2"></div>
    </div>
  </div>

  <!-- Firebase & Logic Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCfTlfkxKu39GkMJ2wSK29KNyZNybBZob8",
      authDomain: "studio-4878590778-ff009.firebaseapp.com",
      projectId: "studio-4878590778-ff009",
      storageBucket: "studio-4878590778-ff009.firebasestorage.app",
      messagingSenderId: "953247695623",
      appId: "1:953247695623:web:83e0a58f27721439ddbba2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allCardsData = [];

    // --- Custom Toast Notification ---
    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast-popup';
      
      const icon = type === 'error' ? '⚠️' : type === 'info' ? 'ℹ️' : '✅';
      toast.innerHTML = `<span class="text-xl">${icon}</span> <span class="text-sm md:text-base">${message}</span>`;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.add('hide');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // --- PWA App Install Logic ---
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent the mini-infobar from appearing on mobile
      e.preventDefault();
      // Stash the event so it can be triggered later.
      deferredPrompt = e;
    });

    window.installApp = async function() {
      if (deferredPrompt) {
        // Show the install prompt
        deferredPrompt.prompt();
        // Wait for the user to respond to the prompt
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          showToast("App installation started...", "success");
        }
        // We've used the prompt, and can't use it again
        deferredPrompt = null;
      } else {
        // Fallback for browsers that do not support the prompt (like iOS Safari) or if already installed
        showToast("আপনার ব্রাউজারের মেনু থেকে 'Install app' বা 'Add to Home Screen' এ ক্লিক করুন।", "info");
      }
    }

    // --- Search Animation ---
    window.openSearch = function() {
      document.getElementById('titleMode').classList.add('hidden');
      document.getElementById('searchMode').classList.remove('hidden');
      document.getElementById('userSearch').focus();
    }
    
    window.closeSearch = function() {
      document.getElementById('titleMode').classList.remove('hidden');
      document.getElementById('searchMode').classList.add('hidden');
      document.getElementById('userSearch').value = '';
      filterUserCards();
    }

    // --- Fetch Data ---
    async function fetchCards() {
      const querySnapshot = await getDocs(collection(db, "codes"));
      querySnapshot.forEach(docSnap => {
        allCardsData.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderCards(allCardsData);
    }

    // --- Render Grid (Supports Advanced Custom Resizing & Positioning) ---
    function renderCards(data) {
      const grid = document.getElementById('dynamicCardsGrid');
      grid.innerHTML = "";
      
      let delay = 0;
      data.forEach(card => {
        // Horizontal Shift Calculation (Center transform-সহ নিখুঁত পজিশনিং)
        const leftOffset = card.imageStyle?.left || "0px";
        const transformStyle = `translateX(calc(-50% + ${leftOffset}))`;

        // Image Custom style apply (max-width none সহ)
        const styleSetting = card.imageStyle ? 
          `width: ${card.imageStyle.width}; height: ${card.imageStyle.height}; top: ${card.imageStyle.top}; left: 50%; transform: ${transformStyle};` : 
          `width: 100%; height: 135px; top: 0; padding: 14px 14px 0 14px; left: 50%; transform: translateX(-50%);`;
          
        // Title Custom style apply (FontSize সহ)
        const titleFontSize = card.imageStyle?.titleFontSize || "20px";
        const titleStyleSetting = card.imageStyle ?
          `top: ${card.imageStyle.titleTop}; font-size: ${titleFontSize};` :
          `top: 142px; font-size: 20px;`;

        const li = document.createElement('li');
        li.innerHTML = `
          <article class="code-card" style="--delay: ${delay}ms">
            <img class="art" src="${card.imageUrl}" style="${styleSetting}" alt="Icon">
            <h2 class="card-name" style="${titleStyleSetting}">${card.title}</h2>
            <div class="card-actions">
              <button class="glass-button" type="button" onclick="openYoutube('${card.youtubeLink}')"><span class="play-icon"></span></button>
              <button class="glass-button get-button" type="button" onclick="openModal('${card.id}')">get code</button>
            </div>
          </article>
        `;
        grid.appendChild(li);
        delay += 60; 
      });
      initObserver();
    }

    window.filterUserCards = function() {
      const query = document.getElementById('userSearch').value.toLowerCase();
      const filtered = allCardsData.filter(c => c.title.toLowerCase().includes(query));
      renderCards(filtered);
    }

    window.openYoutube = function(link) {
      if(link && link.includes("http")) {
        window.open(link, '_blank');
      } else {
        showToast("No YouTube link is attached to this card.", "error");
      }
    }

    // --- Modal & Accordion Logic ---
    window.openModal = function(id) {
      const card = allCardsData.find(c => c.id === id);
      const container = document.getElementById('modalFilesContainer');
      document.getElementById('modalTitle').innerText = card.title;
      container.innerHTML = "";

      if(card.codeSnippets && card.codeSnippets.length > 0) {
        const isSingle = card.codeSnippets.length === 1;

        card.codeSnippets.forEach((file, index) => {
          const isOpenClass = isSingle ? "open" : "";
          const headerActive = isSingle ? "active" : "";

          container.innerHTML += `
            <div class="file-block">
              <div class="file-header ${headerActive}" onclick="toggleAccordion(${index}, ${isSingle})">
                <div class="flex items-center gap-3 overflow-hidden">
                  <div class="accordion-icon ${isSingle ? 'hidden' : ''}">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
                  </div>
                  <svg class="flex-shrink-0 text-blue-400 opacity-80" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                  
                  <div class="flex flex-col text-left truncate">
                     <span class="text-[#e2e8f0] font-semibold tracking-wide text-[15px] md:text-[17px] leading-tight truncate">${file.fileName}</span>
                     ${!isSingle ? '<span class="text-[11px] text-gray-500 font-medium mt-0.5">Click to view code</span>' : ''}
                  </div>
                </div>
                <button onclick="event.stopPropagation(); copyText('${file.fileName}', this, false)" class="text-[12px] font-medium bg-white/5 hover:bg-white/20 border border-white/10 px-3 py-1.5 rounded-lg text-gray-300 hover:text-white transition ml-2 flex-shrink-0 backdrop-blur-md shadow-sm">Copy Name</button>
              </div>
              
              <div class="accordion-body ${isOpenClass}" id="acc-body-${index}">
                <div class="code-container group">
                  <button onclick="copyText(\`${encodeURIComponent(file.code)}\`, this, true)" class="absolute top-3 right-3 text-[12px] font-medium bg-blue-600/90 hover:bg-blue-500 text-white px-4 py-2 rounded-lg backdrop-blur-md shadow-lg transition-all z-10 opacity-90 group-hover:opacity-100 flex items-center gap-1.5">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
                    Copy Code
                  </button>
                  <pre class="m-0 overflow-x-auto text-[13px] md:text-sm text-[#c9d1d9] font-mono whitespace-pre-wrap pt-10 md:pt-4 pb-2 leading-relaxed tracking-tight">${escapeHTML(file.code)}</pre>
                </div>
              </div>
            </div>
          `;
        });
      } else {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-10 opacity-60">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" class="mb-3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="text-gray-400 text-center text-lg">No code files attached.</p>
          </div>
        `;
      }
      
      document.body.style.overflow = 'hidden';
      const modal = document.getElementById('codeModal');
      modal.classList.add('show');
    }

    window.toggleAccordion = function(index, isSingle) {
      if(isSingle) return; 

      const allBodies = document.querySelectorAll('.accordion-body');
      const allHeaders = document.querySelectorAll('.file-header');

      allBodies.forEach((body, i) => {
        if(i === index) {
          body.classList.toggle('open');
          allHeaders[i].classList.toggle('active');
        } else {
          body.classList.remove('open');
          allHeaders[i].classList.remove('active');
        }
      });
    }

    window.closeModal = function() {
      document.body.style.overflow = 'auto'; 
      const modal = document.getElementById('codeModal');
      modal.classList.remove('show');
    }

    // --- Copy Button Logic ---
    window.copyText = function(text, btn, isEncoded) {
      const txt = isEncoded ? decodeURIComponent(text) : text;
      navigator.clipboard.writeText(txt).then(() => {
        const origText = btn.innerHTML; 
        btn.innerText = "Copied ✔";
        btn.style.background = "#16a34a"; 
        btn.style.borderColor = "#16a34a";
        btn.style.color = "white";
        
        setTimeout(() => { 
          btn.innerHTML = origText; 
          btn.style.background = ""; 
          btn.style.borderColor = ""; 
          btn.style.color = ""; 
        }, 2000);
      });
    }

    function escapeHTML(str) { return str.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t)); }

    function initObserver() {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if(e.isIntersecting) {
            e.target.style.transitionDelay = e.target.style.getPropertyValue('--delay');
            e.target.classList.add('is-visible');
            observer.unobserve(e.target);
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.code-card').forEach(c => observer.observe(c));
    }

    fetchCards();
  </script>
</body>
</html>
